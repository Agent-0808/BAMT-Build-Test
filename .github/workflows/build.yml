name: Build Executables

on:
  push:
    tags:
      - 'v*' # Trigger when push tag start with v (etc. v0.1.0)
  workflow_dispatch: # Manual

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - name: GUI
            artifact-name: BA-Modding-Toolkit-Windows-Build
            exe-name: BA-Modding-Toolkit.exe
            script-name: ba_modding_toolkit/__main__.py
            console-mode: disable
            product-name: "BA Modding Toolkit"
            file-description: "BA Modding Toolkit"
          - name: CLI
            artifact-name: BAMT-CLI-Windows-Build
            exe-name: BAMT-CLI.exe
            script-name: ba_modding_toolkit/cli/__main__.py
            console-mode: force
            product-name: "BA Modding Toolkit CLI"
            file-description: "BA Modding Toolkit - Command Line Interface"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install Dependencies
        run: uv export --no-hashes -o requirements.txt && pip install -r requirements.txt

      - name: Extract Version and Generate Meta
        id: get_version
        shell: python
        run: |
          import os
          import re
          import tomllib

          # 读取 pyproject.toml
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
              version = data["project"]["version"]

          print(f"Detected version: {version}")

          # 生成 _version.py 供 Python 代码引用
          with open("src/ba_modding_toolkit/_version.py", "w") as f:
              f.write(f'__version__ = "{version}"\n')

          # Nuitka 的 file-version 必须是纯数字格式 (如 1.2.3.4)
          # 提取开头的数字段（支持最多四段，遇到非数字/点就停）
          match = re.match(r'[vV]?(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?', version)
          if match:
              major, minor, patch, fourth = match.groups()
              major = major or '0'
              minor = minor or '0'
              patch = patch or '0'

              # 如果第四段已经存在（原版本号有四位数字），直接使用
              if fourth is not None:
                  file_version = f"{major}.{minor}.{patch}.{fourth}"
              else:
                  # 没有第四段，判断是否为预发布版
                  if re.search(r'(alpha|beta|rc|dev|a|b|c)', version, re.I):
                      file_version = f"{major}.{minor}.{patch}.8888"
                  else:
                      file_version = f"{major}.{minor}.{patch}.0"
          else:
              file_version = "0.0.0.0"
          print(f"File version for Nuitka: {file_version}")

          # 将版本号设置到 GitHub Action 的输出变量
          # 通过 ${{ steps.get_version.outputs.version }} 引用
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              print(f"version={version}", file=fh)
              print(f"file_version={file_version}", file=fh)

      - name: Build Executable with Nuitka (${{ matrix.name }})
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          working-directory: src
          script-name: ${{ matrix.script-name }}
          mode: onefile

          # 元数据
          windows-icon-from-ico: ba_modding_toolkit/assets/eligma.ico
          product-name: ${{ matrix.product-name }}
          product-version: ${{ steps.get_version.outputs.file_version }}
          file-version: ${{ steps.get_version.outputs.file_version }}
          file-description: ${{ matrix.file-description }}
          company-name: "Agent-0808"
          copyright: "Copyright ©2025-2026 Agent-0808. Licensed under GPLv3."
          trademarks: "Blue Archive ©NEXON Games Co., Ltd. & Yostar, Inc. This tool is unofficial and not endorsed by them."

          clang: true
          low-memory: true
          enable-plugins: tk-inter
          include-package: |
            ba_modding_toolkit
            UnityPy.resources
          include-package-data: |
            ba_modding_toolkit
            UnityPy
            archspec
          include-data-dir: |
            ba_modding_toolkit/assets=ba_modding_toolkit/assets
            ba_modding_toolkit/locales=ba_modding_toolkit/locales
          windows-console-mode: ${{ matrix.console-mode }}
          output-dir: ../build
          output-file: ${{ matrix.exe-name }}
          assume-yes-for-downloads: true

      - name: Prepare Release Directory
        run: |
          $publish_dir = "publish-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $publish_dir -Force
          Copy-Item -Path "build/${{ matrix.exe-name }}" -Destination "$publish_dir/"
          ${{ matrix.name == 'GUI' && 'Copy-Item -Path "src/ba_modding_toolkit/locales" -Destination "publish-GUI/locales" -Recurse' || '' }}
        shell: powershell

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: publish-${{ matrix.name }}/

      - name: Zip Release Asset (When Trigger With Tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag_name = "${{ github.ref_name }}"
          cd publish-${{ matrix.name }}
          Compress-Archive -Path * -DestinationPath "../${{ matrix.artifact-name }}-$tag_name.zip"
        shell: powershell

      - name: Upload Release Asset (When Trigger With Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.artifact-name }}-${{ github.ref_name }}.zip